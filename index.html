<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#063b89"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="assets/school-crest-banner.png"><link rel="stylesheet" href="style.css"><title>SAKO ADMISSION 2570</title><style>.launch{max-width:940px;margin:20px auto;padding:24px;text-align:center}.launch img{width:100%;border-radius:20px}.launch h1{color:#073a83}.launch .btn{margin:10px}
/* SAKO ADMISSION 2570 - Responsive Buttons */

.sako-action-buttons {
  display: flex;
  justify-content: center;
  align-items: stretch;
  flex-wrap: wrap;
  gap: 14px;
  margin: 24px auto;
  width: 100%;
}

.launch .sako-action-buttons .btn {
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;

  flex: 1 1 250px;
  max-width: 340px;
  min-height: 58px;
  padding: 14px 20px;
  margin: 0;

  box-sizing: border-box;
  border-radius: 14px;
  font-size: 17px;
  font-weight: 700;
  line-height: 1.4;
  white-space: normal;
  text-decoration: none;
}

.launch .sako-apply {
  background: #0865b8;
  color: #ffffff;
}

.launch .sako-admin {
  background: #263f80;
  color: #ffffff;
}

/* สำหรับหน้าจอมือถือ */
@media (max-width: 600px) {

  .launch {
    padding: 18px 14px;
  }

  .sako-action-buttons {
    flex-direction: column;
    align-items: stretch;
    gap: 12px;
    margin: 20px 0;
  }

  .launch .sako-action-buttons .btn {
    flex: none;
    width: 100%;
    max-width: none;
    min-height: 56px;
    padding: 14px 12px;
    margin: 0;
    font-size: 16px;
  }

  .launch h1 {
    font-size: clamp(24px, 7vw, 34px);
    line-height: 1.2;
    overflow-wrap: anywhere;
  }
}
</style></head><body><header class="topbar"><a class="brand" href="index.html"><img src="assets/school-crest-banner.png"><span><small>ระบบรับสมัครนักเรียน • ปีการศึกษา 2570</small><strong>โรงเรียนบ้านสากอ</strong></span></a></header><main class="launch panel"><img src="assets/banner-original.jpg" alt="แบนเนอร์โรงเรียนบ้านสากอ"><h1>SAKO ADMISSION 2570</h1><p>ระบบรับสมัครนักเรียนใหม่ ปีการศึกษา 2570</p><p>รับสมัคร อ.1 (3 ขวบ), อ.2, ป.1, ม.1 และนักเรียนย้ายเข้า</p>
<div class="sako-action-buttons">
  <a class="btn sako-apply" id="apply" href="#">
    ✎ กรอกใบสมัครนักเรียน
  </a>

  <a class="btn sako-admin" id="admin" href="#">
    ♙ ผู้ดูแลระบบ / Dashboard
  </a>
</div>
<p id="setup" class="muted"></p></main><script src="config.js"></script><script>const u=window.SAKO_GAS_URL;if(u&&u.startsWith('https://script.google.com/macros/s/')){document.getElementById('apply').href=u;document.getElementById('admin').href=u+'?page=admin'}else{document.getElementById('setup').textContent='ผู้ดูแลต้องตั้งค่า URL ของ Google Apps Script ใน config.js ก่อนเปิดใช้งาน';document.querySelectorAll('.btn').forEach(x=>x.onclick=e=>e.preventDefault())}if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js')</script></body></html>
