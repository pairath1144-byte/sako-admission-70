<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#063b89">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/school-crest-banner.png">
  <link rel="stylesheet" href="style.css">
  <title>SAKO ADMISSION 2570 | โรงเรียนบ้านสากอ</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { max-width: 100%; overflow-x: hidden; }
    .launch { width: calc(100% - 32px); max-width: 940px; margin: 20px auto; padding: 24px; text-align: center; }
    .launch > img { display: block; width: 100%; height: auto; border-radius: 20px; }
    .launch h1 { color: #073a83; line-height: 1.2; overflow-wrap: anywhere; }
    .sako-action-buttons { display: flex; justify-content: center; align-items: stretch; flex-wrap: wrap; gap: 14px; width: 100%; max-width: 100%; margin: 24px auto; }
    .launch .sako-action-buttons a.btn {
      display: flex; align-items: center; justify-content: center; text-align: center;
      flex: 1 1 250px; width: auto; max-width: 340px; min-height: 58px;
      margin: 0; padding: 14px 20px; border-radius: 14px;
      font-size: 17px; font-weight: 700; line-height: 1.4;
      white-space: normal; overflow-wrap: anywhere; text-decoration: none;
      float: none; position: static; transform: none;
      color: #fff;
    }
    .launch .sako-action-buttons .sako-apply { background: #0865b8; }
    .launch .sako-action-buttons .sako-admin { background: #263f80; }
    .launch .sako-action-buttons a.btn:focus-visible { outline: 3px solid #e4ae27; outline-offset: 3px; }
    #setup { overflow-wrap: anywhere; }
    @media (max-width: 600px) {
      .launch { width: calc(100% - 20px); padding: 18px 14px; margin: 14px auto; }
      .launch h1 { font-size: clamp(24px, 7vw, 34px); }
      .sako-action-buttons { flex-direction: column; align-items: stretch; gap: 12px; margin: 20px 0; }
      .launch .sako-action-buttons a.btn { flex: 0 0 auto; width: 100%; max-width: 100%; min-height: 56px; padding: 14px 12px; font-size: 16px; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html">
      <img src="assets/school-crest-banner.png" alt="ตราโรงเรียนบ้านสากอ">
      <span><small>ระบบรับสมัครนักเรียน • ปีการศึกษา 2570</small><strong>โรงเรียนบ้านสากอ</strong></span>
    </a>
  </header>
  <main class="launch panel">
    <img src="assets/banner-original.jpg" alt="แบนเนอร์รับสมัครนักเรียนโรงเรียนบ้านสากอ ปีการศึกษา 2570">
    <h1>SAKO ADMISSION 2570</h1>
    <p>ระบบรับสมัครนักเรียนใหม่ ปีการศึกษา 2570</p>
    <p>รับสมัคร อ.1 (3 ขวบ), อ.2, ป.1, ม.1 และนักเรียนย้ายเข้า</p>
    <div class="sako-action-buttons">
      <a class="btn sako-apply" id="apply" href="#">✎ กรอกใบสมัครนักเรียน</a>
      <a class="btn sako-admin" id="admin" href="#">♙ ผู้ดูแลระบบ / Dashboard</a>
    </div>
    <p id="setup" class="muted" role="status"></p>
  </main>
  <script src="config.js"></script>
  <script>
    'use strict';
    (function () {
      const rawUrl = typeof window.SAKO_GAS_URL === 'string' ? window.SAKO_GAS_URL.trim() : '';
      const url = rawUrl.replace(/\/+$/, '');
      const applyBtn = document.getElementById('apply');
      const adminBtn = document.getElementById('admin');
      const setup = document.getElementById('setup');
      let validUrl = false;
      try {
        const parsed = new URL(url);
        validUrl = parsed.protocol === 'https:' &&
          parsed.hostname === 'script.google.com' &&
          /^\/(?:a\/macros\/[^/]+\/)?macros\/s\/[^/]+\/exec$|^\/a\/macros\/[^/]+\/s\/[^/]+\/exec$/.test(parsed.pathname) &&
          !parsed.search && !parsed.hash;
      } catch (_) { /* Missing or invalid config URL */ }

      if (validUrl) {
        applyBtn.href = url;
        adminBtn.href = url + '?page=admin';
        // Opening outside an in-app browser/iframe avoids embedding restrictions.
        applyBtn.target = '_blank';
        adminBtn.target = '_blank';
        applyBtn.rel = 'noopener noreferrer';
        adminBtn.rel = 'noopener noreferrer';
      } else {
        setup.textContent = 'กรุณาตั้งค่า SAKO_GAS_URL ใน config.js ให้เป็น URL ของ Google Apps Script ที่ลงท้ายด้วย /exec';
        [applyBtn, adminBtn].forEach(function (button) {
          button.addEventListener('click', function (event) { event.preventDefault(); });
        });
      }
      // Service worker is intentionally not registered here while debugging.
      // An older cached index.html can otherwise persist on mobile devices.
    })();
  </script>
</body>
</html>
