<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#063b89">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/school-crest-banner.png">
  <link rel="stylesheet" href="style.css">
  <title>SAKO ADMISSION 2570 | โรงเรียนบ้านสากอ</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    html, body { width: 100%; max-width: 100%; margin: 0; overflow-x: clip; }
    body { min-width: 0; }
    .topbar { width: 100%; max-width: 100%; }
    .topbar .brand { display: flex; align-items: center; gap: 12px; min-width: 0; max-width: 100%; text-decoration: none; }
    .topbar .brand img { width: 60px; height: 60px; flex: 0 0 60px; object-fit: contain; }
    .topbar .brand span { display: flex; flex-direction: column; min-width: 0; overflow-wrap: anywhere; }
    .topbar .brand small { line-height: 1.5; }
    .launch.panel { width: min(940px, calc(100% - 40px)); max-width: 940px; margin: 24px auto; padding: clamp(16px, 3vw, 30px); text-align: center; }
    .launch > img { display: block; width: 100%; max-width: 100%; height: auto; border-radius: 18px; object-fit: contain; }
    .launch h1 { margin: 24px 0 16px; color: #073a83; font-size: clamp(25px, 4.2vw, 44px); line-height: 1.2; overflow-wrap: anywhere; }
    .launch p { max-width: 100%; overflow-wrap: anywhere; line-height: 1.65; }
    .sako-action-buttons { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; width: 100%; margin: 24px auto 10px; }
    .launch .sako-action-buttons a.btn { display: flex; align-items: center; justify-content: center; min-width: 0; width: 100%; max-width: none; min-height: 60px; margin: 0; padding: 14px 18px; border: 0; border-radius: 14px; color: white; text-align: center; text-decoration: none; font-size: clamp(15px, 1.7vw, 18px); font-weight: 700; line-height: 1.45; white-space: normal; overflow-wrap: anywhere; float: none; position: static; transform: none; }
    .launch .sako-action-buttons .sako-apply { background: #0865b8; }
    .launch .sako-action-buttons .sako-admin { background: #263f80; }
    .launch .sako-action-buttons a.btn:hover { filter: brightness(1.08); }
    .launch .sako-action-buttons a.btn:focus-visible { outline: 3px solid #e4ae27; outline-offset: 3px; }
    #setup { overflow-wrap: anywhere; }
    @media (min-width: 601px) and (max-width: 1024px) {
      .launch.panel { width: calc(100% - 36px); margin: 20px auto; padding: 24px; }
      .sako-action-buttons { gap: 14px; }
      .launch .sako-action-buttons a.btn { min-height: 64px; font-size: 17px; }
    }
    @media (max-width: 600px) {
      .topbar .brand { gap: 9px; }
      .topbar .brand img { width: 46px; height: 46px; flex-basis: 46px; }
      .topbar .brand small { font-size: 12px; }
      .launch.panel { width: calc(100% - 20px); margin: 12px auto; padding: 16px 12px 22px; }
      .launch > img { border-radius: 13px; }
      .launch h1 { margin: 20px 0 12px; font-size: clamp(23px, 6.5vw, 32px); }
      .launch p { margin: 12px 0; font-size: 15px; }
      .sako-action-buttons { grid-template-columns: minmax(0, 1fr); gap: 12px; margin: 20px 0 8px; }
      .launch .sako-action-buttons a.btn { min-height: 58px; padding: 14px 12px; font-size: 16px; }
    }
    @media (max-width: 360px) {
      .launch.panel { width: calc(100% - 12px); padding: 12px 10px 18px; }
      .launch .sako-action-buttons a.btn { font-size: 15px; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html">
      <img src="assets/school-crest-banner.png" alt="ตราโรงเรียนบ้านสากอ">
      <span><small>ระบบรับสมัครนักเรียน • ปีการศึกษา 2570</small><strong>โรงเรียนบ้านสากอ</strong></span>
    </a>
  </header>
  <main class="launch panel">
    <img src="assets/banner-original.jpg" alt="แบนเนอร์รับสมัครนักเรียนโรงเรียนบ้านสากอ ปีการศึกษา 2570">
    <h1>SAKO ADMISSION 2570</h1>
    <p>ระบบรับสมัครนักเรียนใหม่ ปีการศึกษา 2570</p>
    <p>รับสมัคร อ.1 (3 ขวบ), อ.2, ป.1, ม.1 และนักเรียนย้ายเข้า</p>
    <div class="sako-action-buttons">
      <a class="btn sako-apply" id="apply" href="#">✎ กรอกใบสมัครนักเรียน</a>
      <a class="btn sako-admin" id="admin" href="#">♙ ผู้ดูแลระบบ / Dashboard</a>
    </div>
    <p id="setup" class="muted" role="status"></p>
  </main>
  <script src="config.js?v=2570-responsive-2"></script>
  <script>
    'use strict';
    (function () {
      const rawUrl = typeof window.SAKO_GAS_URL === 'string' ? window.SAKO_GAS_URL.trim() : '';
      const url = rawUrl.replace(/\/+$/, '');
      const applyBtn = document.getElementById('apply');
      const adminBtn = document.getElementById('admin');
      const setup = document.getElementById('setup');
      let validUrl = false;
      try {
        const parsed = new URL(url);
        validUrl = parsed.protocol === 'https:' &&
          parsed.hostname === 'script.google.com' &&
          /^\/(?:macros\/s|a\/macros\/[^/]+\/s)\/[^/]+\/exec$/.test(parsed.pathname) &&
          !parsed.search && !parsed.hash;
      } catch (_) { /* Missing or invalid config URL */ }

      if (validUrl) {
        applyBtn.href = url;
        adminBtn.href = url + '?page=admin';
        // Opening outside an in-app browser/iframe avoids embedding restrictions.
        applyBtn.target = '_blank';
        adminBtn.target = '_blank';
        applyBtn.rel = 'noopener noreferrer';
        adminBtn.rel = 'noopener noreferrer';
      } else {
        setup.textContent = 'กรุณาตั้งค่า SAKO_GAS_URL ใน config.js ให้เป็น URL ของ Google Apps Script ที่ลงท้ายด้วย /exec';
        [applyBtn, adminBtn].forEach(function (button) {
          button.addEventListener('click', function (event) { event.preventDefault(); });
        });
      }
      // Service worker is intentionally not registered here while debugging.
      // An older cached index.html can otherwise persist on mobile devices.
    })();
  </script>
</body>
</html>
